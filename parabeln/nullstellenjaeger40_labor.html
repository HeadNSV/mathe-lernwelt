<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nullstellen-Jäger — Labor</title>
<style>
  :root{ --bg:#0b0e13; --fg:#e6edf3; --muted:#9aa4b2; --accent:#f2a63c; --line:#2a3038; }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Roboto,sans-serif;}
  #wrap{max-width:640px;margin:0 auto;padding:18px 20px 40px;}
  h3{margin:0 0 6px;}
  .hint{font-size:13px;color:var(--muted);margin-bottom:12px;}
  #progress{font-size:13px;color:var(--muted);margin-bottom:8px;}
  #missionText{font-size:15px;color:var(--accent);text-align:center;font-weight:700;margin-bottom:10px;}
  .controls{background:#151b24;border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:12px;}
  .row{display:flex;align-items:center;gap:12px;margin:8px 0;}
  .row label{font-size:14px;color:var(--muted);min-width:22px;}
  input[type=range]{flex:1;}
  .valbox{background:#1f2630;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:14px;font-weight:700;color:var(--accent);min-width:40px;text-align:center;}
  #svgHost{background:#0e131b;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;}
  #eqLabel{text-align:center;font-size:14px;color:var(--muted);margin:6px 0;}
  #dLabel{text-align:center;font-size:15px;color:#5fd0c7;font-weight:700;min-height:22px;margin:6px 0;}
  #feedback{text-align:center;font-size:14px;min-height:20px;margin-top:6px;color:var(--fg);}
  #nextBtn{display:none;margin:10px auto 0;background:var(--accent);color:#12100a;font-weight:700;border:0;border-radius:8px;padding:9px 18px;font-size:14px;cursor:pointer;}
  #doneBox{text-align:center;font-size:16px;color:var(--accent);font-weight:700;margin-top:16px;display:none;}
</style>
</head>
<body>
<div id="wrap">
  <h3>🎯 Nullstellen-Jäger</h3>
  <p class="hint">Stelle a, b und c so ein, dass die Diskriminante die geforderte Bedingung erfüllt.</p>
  <div id="progress">Mission 1 / 3</div>
  <div id="missionText"></div>
  <div class="controls">
    <div class="row"><label for="aSlider">a</label><input type="range" id="aSlider" min="1" max="3" step="1" value="1"/><span class="valbox" id="aVal">1</span></div>
    <div class="row"><label for="bSlider">b</label><input type="range" id="bSlider" min="-6" max="6" step="1" value="0"/><span class="valbox" id="bVal">0</span></div>
    <div class="row"><label for="cSlider">c</label><input type="range" id="cSlider" min="-6" max="6" step="1" value="1"/><span class="valbox" id="cVal">1</span></div>
  </div>
  <div id="eqLabel"></div>
  <div id="dLabel"></div>
  <div id="svgHost"></div>
  <div id="feedback"></div>
  <button id="nextBtn">Nächste Mission ▸</button>
  <div id="doneBox">✅ Alle drei Nullstellen-Fälle getroffen — die Diskriminante hat keine Geheimnisse mehr!</div>
</div>
<script>
const MISSIONS=[
  {label:"Stelle eine Parabel ein, die die x-Achse GENAU BERÜHRT (D=0)", check:D=>D===0, resetA:1, resetB:0, resetC:1},
  {label:"Stelle eine Parabel ein, die die x-Achse ZWEIMAL schneidet (D>0)", check:D=>D>0, resetA:1, resetB:0, resetC:1},
  {label:"Stelle eine Parabel ein, die die x-Achse GAR NICHT trifft (D<0)", check:D=>D<0, resetA:1, resetB:0, resetC:-1}
];
let mi=0, a=1, b=0, c=1, missionSolved=[false,false,false];

function toX(x){ return 150+x*20; }
function toY(y){ return 150-y*20; }
function buildSVG(){
  let s='<svg viewBox="0 0 300 300" style="width:100%;max-width:300px;height:auto;display:block;margin:0 auto;">';
  s+='<line x1="0" y1="150" x2="300" y2="150" stroke="#9aa4b2" stroke-width="1"/>';
  s+='<line x1="150" y1="0" x2="150" y2="300" stroke="#9aa4b2" stroke-width="1"/>';
  let pts=[];
  for(let x=-7; x<=7.001; x+=0.15){
    const y=a*x*x+b*x+c;
    const py=toY(y);
    if(py>-20 && py<320) pts.push(toX(x)+","+py);
  }
  s+='<polyline points="'+pts.join(" ")+'" fill="none" stroke="#f2a63c" stroke-width="2.5"/>';
  s+='</svg>';
  return s;
}
function render(){
  const m=MISSIONS[mi];
  document.getElementById('progress').textContent='Mission '+(mi+1)+' / '+MISSIONS.length;
  document.getElementById('missionText').textContent=m.label;
  document.getElementById('feedback').textContent='';
  document.getElementById('nextBtn').style.display='none';
  a=m.resetA; b=m.resetB; c=m.resetC;
  document.getElementById('aSlider').value=a;
  document.getElementById('bSlider').value=b;
  document.getElementById('cSlider').value=c;
  updateDisplay();
}
function updateDisplay(){
  document.getElementById('aVal').textContent=a;
  document.getElementById('bVal').textContent=b;
  document.getElementById('cVal').textContent=c;
  document.getElementById('eqLabel').textContent='f(x) = '+a+'x² '+(b>=0?'+ '+b:'− '+Math.abs(b))+'x '+(c>=0?'+ '+c:'− '+Math.abs(c));
  const D=b*b-4*a*c;
  document.getElementById('dLabel').textContent='D = '+D+' → '+(D>0?'zwei einfache Nullstellen':(D===0?'eine doppelte Nullstelle':'keine Nullstelle'));
  document.getElementById('svgHost').innerHTML=buildSVG();
  checkHit(D);
}
function checkHit(D){
  if(missionSolved[mi]) return;
  const m=MISSIONS[mi];
  if(m.check(D)){
    missionSolved[mi]=true;
    document.getElementById('feedback').textContent='✅ Erreicht! D='+D+' erfüllt die Bedingung.';
    window.lwAward && window.lwAward('mission', 'mission'+(mi+1));
    document.getElementById('nextBtn').style.display = (mi<MISSIONS.length-1) ? 'block' : 'none';
    checkAllDone();
  }
}
document.getElementById('aSlider').addEventListener('input', e=>{ a=parseInt(e.target.value); updateDisplay(); });
document.getElementById('bSlider').addEventListener('input', e=>{ b=parseInt(e.target.value); updateDisplay(); });
document.getElementById('cSlider').addEventListener('input', e=>{ c=parseInt(e.target.value); updateDisplay(); });
document.getElementById('nextBtn').onclick=()=>{
  if(mi<MISSIONS.length-1){ mi++; render(); }
};
function checkAllDone(){
  if(missionSolved.every(Boolean)){
    document.getElementById('doneBox').style.display='block';
    window.lwAward && window.lwAward('mission', 'nullstellenjaeger_komplett');
  }
}
render();

// Test-Hook fuer Playwright-Verifikation
window.LAB = {
  state: () => ({ mission: mi, a: a, b: b, c: c, D: b*b-4*a*c, missionSolved: missionSolved.slice() }),
  setA: (v) => { a=v; document.getElementById('aSlider').value=v; updateDisplay(); },
  setB: (v) => { b=v; document.getElementById('bSlider').value=v; updateDisplay(); },
  setC: (v) => { c=v; document.getElementById('cSlider').value=v; updateDisplay(); },
  nextMission: () => document.getElementById('nextBtn').click()
};
</script>
<script src="../gamify.js" defer></script>
</body>
</html>
