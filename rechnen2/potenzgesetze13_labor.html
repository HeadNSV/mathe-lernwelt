<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gesetz-Sortierer — Potenzgesetze</title>
<style>
  :root{ --bg:#0b0e13; --fg:#e6edf3; --muted:#9aa4b2; --accent:#f2a63c; --line:#2a3038; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Roboto,sans-serif;}
  #wrap{padding:14px 18px;height:100%;overflow-y:auto;}
  h3{margin:0 0 8px;font-size:18px;color:var(--accent);}
  .hint{font-size:12.5px;color:var(--muted);margin:4px 0 10px;}
  .modebar{display:flex;gap:8px;margin-bottom:12px;}
  .modebar button{background:#1f2630;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-size:13.5px;cursor:pointer;}
  .modebar button.on{background:var(--accent);color:#12100a;font-weight:700;}
  .part{display:none;}
  .part.show{display:block;}
  #termBox{text-align:center;font-size:28px;font-weight:700;color:var(--accent);margin:10px 0;}
  .askrow{margin:12px 0;}
  .asklabel{font-size:14px;color:var(--muted);margin-bottom:6px;}
  .optrow{display:flex;gap:8px;flex-wrap:wrap;}
  .optchip{background:#1f2630;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;}
  .optchip:disabled{opacity:0.4;cursor:default;}
  .optchip.correctpick{background:#1c3d24;border-color:#4caf50;}
  .optchip.wrongpick{background:#3d1c1c;border-color:#c0392b;}
  #svgHost{margin:14px 0;text-align:center;min-height:70px;}
  #progress{font-size:14px;color:var(--muted);text-align:center;margin-top:6px;}
  #missionDone{display:none;background:#173d28;border:1px solid #4caf50;border-radius:8px;padding:12px 16px;font-size:15px;text-align:center;margin-top:10px;}
  #missionDone.show{display:block;}
  #puzzleClaim{text-align:center;font-size:24px;font-weight:700;color:#e6edf3;margin:16px 0;}
  #revealBtn{display:block;margin:10px auto;background:var(--accent);color:#12100a;font-weight:700;border:0;border-radius:8px;padding:9px 18px;font-size:14.5px;cursor:pointer;}
  #puzzleReveal{display:none;margin-top:10px;font-size:14.5px;color:#dff3df;text-align:center;}
  #puzzleReveal.show{display:block;}
</style>
</head>
<body>
<div id="wrap">
  <h3>🧪 Gesetz-Sortierer</h3>
  <div class="modebar">
    <button id="modeSort" class="on">🎯 Gesetz-Sortierer</button>
    <button id="modePuzzle">🕵️ Finde den Potenz-Fehler</button>
  </div>

  <div class="part show" id="partSort">
    <p class="hint">Ein Term erscheint — wähle das passende Potenzgesetz und dann das richtige Ergebnis.</p>
    <div id="termBox"></div>
    <div class="askrow">
      <div class="asklabel">Welches Gesetz passt?</div>
      <div class="optrow" id="lawRow"></div>
    </div>
    <div class="askrow">
      <div class="asklabel">Wie lautet das Ergebnis?</div>
      <div class="optrow" id="resRow"></div>
    </div>
    <div id="svgHost"></div>
    <div id="progress"></div>
    <div id="missionDone"></div>
  </div>

  <div class="part" id="partPuzzle">
    <p class="hint">Ein Mitschüler behauptet, diese Vereinfachung sei richtig. Stimmt das?</p>
    <div id="puzzleClaim"></div>
    <button id="revealBtn">Stimmt das? ▸</button>
    <div id="puzzleReveal"></div>
  </div>
</div>
<script>
const TERMS=[
  {disp:"a³ · a²", law:"gleiche Basis ·", result:"a⁵", op:'mul', x:3, y:2},
  {disp:"a⁶ : a²", law:"gleiche Basis :", result:"a⁴", op:'div', x:6, y:2},
  {disp:"(a²)³", law:"Potenz einer Potenz", result:"a⁶", op:'pow', x:2, y:3},
  {disp:"a · a⁴", law:"gleiche Basis ·", result:"a⁵", op:'mul', x:1, y:4},
  {disp:"(a³)²", law:"Potenz einer Potenz", result:"a⁶", op:'pow', x:3, y:2},
  {disp:"a⁷ : a³", law:"gleiche Basis :", result:"a⁴", op:'div', x:7, y:3}
];
const LAWS=["gleiche Basis ·","gleiche Basis :","Potenz einer Potenz","gleicher Exponent"];
let ti=0, lawPicked=false, resPicked=false, correctFirstTry=0;

function buildResultTilesSVG(n){
  const tw=26, th=26, gap=4, x0=8, y0=6;
  let s='';
  for(let i=0;i<n;i++){
    const x=x0+i*(tw+gap);
    s+='<rect x="'+x+'" y="'+y0+'" width="'+tw+'" height="'+th+'" rx="5" fill="rgba(76,175,80,0.26)" stroke="#4caf50" stroke-width="1.4"/>';
    s+='<text x="'+(x+tw/2)+'" y="'+(y0+th/2+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#8adf9c">a</text>';
  }
  const W=x0+n*(tw+gap)+8, H=y0+th+10;
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:300px;height:auto;display:block;margin:0 auto;">'+s+'</svg>';
}

function shuffledOptions(correct, pool){
  const opts=new Set([correct]);
  const others=pool.filter(x=>x!==correct);
  while(opts.size<3 && others.length){
    const i=Math.floor(Math.random()*others.length);
    opts.add(others.splice(i,1)[0]);
  }
  return [...opts].sort(()=>Math.random()-0.5);
}

function resultPool(){
  return ["a⁴","a⁵","a⁶","a⁷","a⁹","a¹²"];
}

function loadTerm(){
  if(ti>=TERMS.length){
    document.getElementById('missionDone').classList.add('show');
    document.getElementById('missionDone').textContent='🎉 Alle '+TERMS.length+' Terme geschafft! '+correctFirstTry+' davon im ersten Versuch richtig.';
    window.lwAward && window.lwAward('mission');
    document.getElementById('termBox').textContent='';
    document.getElementById('lawRow').innerHTML='';
    document.getElementById('resRow').innerHTML='';
    document.getElementById('svgHost').innerHTML='';
    return;
  }
  const t=TERMS[ti];
  lawPicked=false; resPicked=false;
  let firstTryClean=true;
  document.getElementById('termBox').textContent=t.disp;
  document.getElementById('progress').textContent='Term '+(ti+1)+' / '+TERMS.length+' · bisher '+correctFirstTry+' im ersten Versuch richtig';
  document.getElementById('svgHost').innerHTML='';

  const lawOpts=shuffledOptions(t.law, LAWS);
  const lawRow=document.getElementById('lawRow');
  lawRow.innerHTML='';
  lawOpts.forEach(opt=>{
    const b=document.createElement('button');
    b.className='optchip'; b.textContent=opt;
    b.onclick=()=>{
      if(opt===t.law){
        b.classList.add('correctpick');
        lawRow.querySelectorAll('.optchip').forEach(x=>x.disabled=true);
        lawPicked=true;
        checkBothPicked(t, firstTryClean);
      } else {
        b.classList.add('wrongpick'); firstTryClean=false;
        setTimeout(()=>b.classList.remove('wrongpick'),600);
      }
    };
    lawRow.appendChild(b);
  });

  const resOpts=shuffledOptions(t.result, resultPool());
  const resRow=document.getElementById('resRow');
  resRow.innerHTML='';
  resOpts.forEach(opt=>{
    const b=document.createElement('button');
    b.className='optchip'; b.textContent=opt;
    b.onclick=()=>{
      if(opt===t.result){
        b.classList.add('correctpick');
        resRow.querySelectorAll('.optchip').forEach(x=>x.disabled=true);
        resPicked=true;
        checkBothPicked(t, firstTryClean);
      } else {
        b.classList.add('wrongpick'); firstTryClean=false;
        setTimeout(()=>b.classList.remove('wrongpick'),600);
      }
    };
    resRow.appendChild(b);
  });
}

let doneForTerm=false;
function checkBothPicked(t, firstTryClean){
  if(lawPicked && resPicked && !doneForTerm){
    doneForTerm=true;
    if(firstTryClean) correctFirstTry++;
    const n = t.op==='mul' ? t.x+t.y : (t.op==='div' ? t.x-t.y : t.x*t.y);
    document.getElementById('svgHost').innerHTML=buildResultTilesSVG(n);
    setTimeout(()=>{ ti++; doneForTerm=false; loadTerm(); }, 1400);
  }
}
loadTerm();

// === Raetsel-Modus ===
const PUZZLE={claim:"a² · a³ = a⁶", wrong:true, explain:"Falsch! Beim Multiplizieren gleicher Basen werden die Exponenten ADDIERT, nicht multipliziert: a² · a³ = a²⁺³ = a⁵. a⁶ käme nur bei einer Potenz einer Potenz wie (a²)³ heraus."};
function renderPuzzle(){
  document.getElementById('puzzleClaim').textContent=PUZZLE.claim;
  document.getElementById('puzzleReveal').classList.remove('show');
  document.getElementById('puzzleReveal').textContent='';
}
document.getElementById('revealBtn').onclick=()=>{
  const el=document.getElementById('puzzleReveal');
  el.textContent=(PUZZLE.wrong?'❌ ':'✅ ')+PUZZLE.explain;
  el.classList.add('show');
};

const modeSort=document.getElementById('modeSort'), modePuzzle=document.getElementById('modePuzzle');
const partSort=document.getElementById('partSort'), partPuzzle=document.getElementById('partPuzzle');
modeSort.onclick=()=>{ modeSort.classList.add('on'); modePuzzle.classList.remove('on'); partSort.classList.add('show'); partPuzzle.classList.remove('show'); };
modePuzzle.onclick=()=>{ modePuzzle.classList.add('on'); modeSort.classList.remove('on'); partPuzzle.classList.add('show'); partSort.classList.remove('show'); renderPuzzle(); };
</script>
<script src="../gamify.js" defer></script>
</body>
</html>
