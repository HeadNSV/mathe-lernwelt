<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ungleichungs-Umformer — Labor</title>
<style>
  :root{ --bg:#0b0e13; --fg:#e6edf3; --muted:#9aa4b2; --accent:#f2a63c; --line:#2a3038; }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Roboto,sans-serif;}
  #wrap{max-width:760px;margin:0 auto;padding:18px 20px 40px;}
  h3{margin:0 0 6px;}
  .hint{font-size:13px;color:var(--muted);margin-bottom:12px;}
  .modebar{display:flex;gap:8px;margin-bottom:14px;}
  .modebar button{background:#1f2630;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;}
  .modebar button.on{background:var(--accent);color:#12100a;font-weight:700;border-color:var(--accent);}
  .part{display:none;}
  .part.show{display:block;}
  .missionbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .missionbar button{background:#1f2630;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;}
  .missionbar button.on{background:var(--accent);color:#12100a;font-weight:700;border-color:var(--accent);}
  .missionbar button.done{border-color:#4caf50;}
  #desc{background:#151b24;border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:14px;color:var(--muted);margin-bottom:10px;}
  #eqBox{font-size:24px;color:var(--accent);text-align:center;font-weight:700;margin:14px 0;transition:transform .5s;}
  #eqBox .rel{display:inline-block;transition:transform .5s;}
  #eqBox .rel.flip{transform:rotate(180deg);color:#c0392b;}
  #flipNote{text-align:center;font-size:13px;color:#c0392b;min-height:18px;font-weight:700;}
  #stepRow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0;}
  #stepRow button{background:#1f2630;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:14.5px;cursor:pointer;}
  #stepRow button.wrong{border-color:#c0392b;opacity:0.7;}
  #feedback{background:#151b24;border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:14.5px;text-align:center;min-height:24px;}
  #feedback.ok{border-color:#4caf50;background:#173d28;}
  #feedback.bad{border-color:#c0392b;background:#3d1c1c;}
  #progress{font-size:14px;color:var(--muted);text-align:center;margin-top:10px;}
  #missionDone{display:none;background:#173d28;border:1px solid #4caf50;border-radius:8px;padding:14px 18px;font-size:15px;color:#dff3df;text-align:center;margin-top:10px;}
  #missionDone.show{display:block;}
  button.resetbtn{display:block;margin:14px auto 0;background:#1f2630;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 16px;font-size:13.5px;cursor:pointer;}
  #puzzleWrap .quest{background:#151b24;border:1px solid var(--line);border-radius:8px;padding:14px 18px;font-size:15px;margin-bottom:10px;}
  #puzzleOpts{display:flex;flex-direction:column;gap:8px;}
  #puzzleOpts button{background:#1f2630;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;text-align:left;}
  #puzzleFeedback{margin-top:10px;font-size:14px;min-height:20px;}
  #puzzleFeedback.ok{color:#4caf50;}
  #puzzleFeedback.bad{color:#e05a5a;}
</style>
</head>
<body>
<div id="wrap">
  <div class="modebar">
    <button id="modeMission" class="on">🎯 Ungleichung umformen</button>
    <button id="modePuzzle">🕵️ Finde den Zeichen-Fehler</button>
  </div>

  <div class="part show" id="partMission">
    <h3>🎯 Löse die Ungleichung — beobachte, wann das Zeichen kippt</h3>
    <p class="hint">Klick die Umformungs-Kacheln in der richtigen Reihenfolge. Bei Division/Multiplikation mit einer negativen Zahl dreht sich das Relationszeichen sichtbar.</p>
    <div class="missionbar" id="missionbar"></div>
    <div id="desc"></div>
    <div id="eqBox"></div>
    <div id="flipNote"></div>
    <div id="stepRow"></div>
    <div id="feedback">Wähle den ersten Umformungsschritt.</div>
    <div id="progress"></div>
    <div id="missionDone"></div>
    <button class="resetbtn" id="resetBtn">↺ Aufgabe neu starten</button>
  </div>

  <div class="part" id="partPuzzle">
    <h3>🕵️ Wurde das Zeichen korrekt behandelt?</h3>
    <div id="puzzleWrap"></div>
  </div>
</div>
<script>
// === Missionsmodus: 3 kuratierte Ungleichungen, je 2 Schritte ===
const MISSIONS=[
  {
    id:'a', chip:'Aufgabe A',
    desc:'−3x+5 < 11 nach x auflösen. G=ℝ.',
    start:{left:'−3x+5', rel:'<', right:'11'},
    steps:[
      {correct:'|−5  (beide Seiten)', trap:'|−3x  (beide Seiten)', after:{left:'−3x', rel:'<', right:'6'}, flips:false, trapWhy:'Die 5 ist die additive Konstante — die muss zuerst weg. „−3x" ist kein gültiger Umformungsschritt (man subtrahiert Zahlen oder Terme, nicht den Koeffizienten allein).'},
      {correct:'|:(−3)  (beide Seiten)', trap:'|:3  (beide Seiten)', after:{left:'x', rel:'>', right:'−2'}, flips:true, trapWhy:'Der Koeffizient von x ist −3, NICHT 3 — du musst durch die tatsächlich vorhandene Zahl teilen, und die ist negativ, also dreht sich das Zeichen.'}
    ]
  },
  {
    id:'b', chip:'Aufgabe B',
    desc:'2−4x ≥ −6 nach x auflösen. G=ℝ.',
    start:{left:'2−4x', rel:'≥', right:'−6'},
    steps:[
      {correct:'|−2  (beide Seiten)', trap:'|+4x  (beide Seiten)', after:{left:'−4x', rel:'≥', right:'−8'}, flips:false, trapWhy:'Die 2 ist die additive Konstante — die muss zuerst weg, bevor der x-Term isoliert wird.'},
      {correct:'|:(−4)  (beide Seiten)', trap:'|:4  (beide Seiten)', after:{left:'x', rel:'≤', right:'2'}, flips:true, trapWhy:'Der Koeffizient von x ist −4, NICHT 4 — Division durch eine negative Zahl dreht das Zeichen.'}
    ]
  },
  {
    id:'c', chip:'Aufgabe C',
    desc:'3x−2 > 7 nach x auflösen. G=ℝ.',
    start:{left:'3x−2', rel:'>', right:'7'},
    steps:[
      {correct:'|+2  (beide Seiten)', trap:'|−2  (beide Seiten)', after:{left:'3x', rel:'>', right:'9'}, flips:false, trapWhy:'Auf der linken Seite steht −2, die muss durch +2 aufgehoben werden, nicht nochmal subtrahiert.'},
      {correct:'|:3  (beide Seiten)', trap:'|:(−3)  (beide Seiten)', after:{left:'x', rel:'>', right:'3'}, flips:false, trapWhy:'Der Koeffizient von x ist +3, eine POSITIVE Zahl — das Zeichen bleibt unverändert. Hier gibt es keinen Zeichen-Dreh!'}
    ]
  }
];
let curIdx=0, stepIdx=0, doneSet=new Set();

function eqStr(st){ return st.left+' '+st.rel+' '+st.right; }

function renderBar(){
  const bar=document.getElementById('missionbar');
  bar.innerHTML='';
  MISSIONS.forEach((m,i)=>{
    const b=document.createElement('button');
    b.textContent=m.chip;
    if(i===curIdx) b.classList.add('on');
    if(doneSet.has(m.id)) b.classList.add('done');
    b.onclick=()=>{ curIdx=i; stepIdx=0; render(); };
    bar.appendChild(b);
  });
}
function render(){
  renderBar();
  const m=MISSIONS[curIdx];
  document.getElementById('desc').textContent=m.desc;
  const eqBox=document.getElementById('eqBox');
  const flipNote=document.getElementById('flipNote');
  const tileRow=document.getElementById('stepRow');
  tileRow.innerHTML='';
  flipNote.textContent='';
  const st = stepIdx===0 ? m.start : m.steps[stepIdx-1].after;
  eqBox.innerHTML = st.left+' <span class="rel">'+st.rel+'</span> '+st.right;
  if(stepIdx>=m.steps.length){
    tileRow.style.display='none';
    document.getElementById('progress').textContent='Ungleichung gelöst ✓';
    return;
  }
  tileRow.style.display='flex';
  const step=m.steps[stepIdx];
  const opts = Math.random()<0.5 ? [{label:step.correct,ok:true},{label:step.trap,ok:false}] : [{label:step.trap,ok:false},{label:step.correct,ok:true}];
  opts.forEach(opt=>{
    const b=document.createElement('button');
    b.textContent=opt.label;
    b.onclick=()=>pickTile(opt,b,step);
    tileRow.appendChild(b);
  });
  document.getElementById('progress').textContent='Schritt '+(stepIdx+1)+' / '+m.steps.length;
}
function pickTile(opt,btn,step){
  const fb=document.getElementById('feedback');
  if(!opt.ok){
    btn.classList.add('wrong');
    fb.className='bad';
    fb.textContent='❌ '+step.trapWhy;
    return;
  }
  fb.className='ok';
  fb.textContent='✅ '+opt.label+' angewendet: '+eqStr(step.after);
  if(step.flips){
    const relEl=document.querySelector('#eqBox .rel');
    if(relEl){ relEl.classList.add('flip'); }
    document.getElementById('flipNote').textContent='⚡ Das Zeichen kippt — Division durch eine negative Zahl!';
  }
  stepIdx++;
  const m=MISSIONS[curIdx];
  setTimeout(()=>{
    render();
    if(stepIdx>=m.steps.length){
      doneSet.add(m.id);
      if(doneSet.size===MISSIONS.length){
        document.getElementById('missionDone').classList.add('show');
        document.getElementById('missionDone').textContent='🎉 Alle 3 Ungleichungen gelöst!';
        window.lwAward && window.lwAward('mission');
      }
    }
  }, step.flips ? 650 : 50);
}
document.getElementById('resetBtn').onclick=()=>{
  stepIdx=0;
  document.getElementById('feedback').className='';
  document.getElementById('feedback').textContent='Wähle den ersten Umformungsschritt.';
  render();
};
render();

// === Raetselmodus: Zeichen-Fehler finden ===
const SCENARIOS=[
  {desc:'5 < 9. Schritt: |·(−1). Ergebnis geschrieben als: −5 < −9.', ok:false, why:"Falsch — nach Multiplikation mit −1 muss das Zeichen gedreht werden: −5 > −9 ist richtig (−5 liegt näher an 0, ist also größer)."},
  {desc:'5 < 9. Schritt: |·(−1). Ergebnis geschrieben als: −5 > −9.', ok:true, why:"Richtig — Multiplikation mit einer negativen Zahl dreht das Zeichen, aus < wird >."},
  {desc:'4x+2 > 10. Schritt: |−2 (beide Seiten). Ergebnis: 4x > 8.', ok:true, why:"Richtig — Addition/Subtraktion dreht das Zeichen NIE, egal welches Vorzeichen die Zahl hat."},
  {desc:'−2x > 8. Schritt: |:(−2). Ergebnis geschrieben als: x > −4.', ok:false, why:"Falsch — bei Division durch eine negative Zahl muss das Zeichen gedreht werden: x < −4 ist richtig."},
  {desc:'3x < 12. Schritt: |:3. Ergebnis geschrieben als: x > 4.', ok:false, why:"Falsch — 3 ist POSITIV, das Zeichen bleibt unverändert: x < 4 ist richtig. Gedreht wird NUR bei negativen Zahlen (Überkorrektur-Falle!)."},
  {desc:'−x ≥ 5. Schritt: |·(−1). Ergebnis geschrieben als: x ≤ −5.', ok:true, why:"Richtig — Multiplikation mit −1 dreht das Zeichen, aus ≥ wird ≤."}
];
(function(){
  const wrap=document.getElementById('puzzleWrap');
  let si=0;
  function loadScenario(){
    wrap.innerHTML='';
    if(si>=SCENARIOS.length){
      wrap.innerHTML='<div class="quest">🎉 Alle Szenarien durchgespielt! Starte von vorn, indem du die Seite neu lädst.</div>';
      return;
    }
    const sc=SCENARIOS[si];
    const q=document.createElement('div'); q.className='quest'; q.textContent=sc.desc;
    wrap.appendChild(q);
    const opts=document.createElement('div'); opts.id='puzzleOpts';
    const fb=document.createElement('div'); fb.id='puzzleFeedback';
    ['✅ Korrekt behandelt','❌ Falsch behandelt'].forEach((label,oi)=>{
      const b=document.createElement('button');
      b.textContent=label;
      b.onclick=()=>{
        const said=(oi===0);
        if(said===sc.ok){ fb.className='ok'; fb.textContent='✅ '+sc.why; }
        else { fb.className='bad'; fb.textContent='❌ '+sc.why; }
        setTimeout(()=>{ si++; loadScenario(); }, 1800);
      };
      opts.appendChild(b);
    });
    wrap.appendChild(opts);
    wrap.appendChild(fb);
  }
  loadScenario();
})();

// mode switch
const modeMission=document.getElementById('modeMission'), modePuzzle=document.getElementById('modePuzzle');
const partMission=document.getElementById('partMission'), partPuzzle=document.getElementById('partPuzzle');
modeMission.onclick=()=>{ modeMission.classList.add('on'); modePuzzle.classList.remove('on'); partMission.classList.add('show'); partPuzzle.classList.remove('show'); };
modePuzzle.onclick=()=>{ modePuzzle.classList.add('on'); modeMission.classList.remove('on'); partPuzzle.classList.add('show'); partMission.classList.remove('show'); };
</script>
<script src="../gamify.js" defer></script>
</body>
</html>
