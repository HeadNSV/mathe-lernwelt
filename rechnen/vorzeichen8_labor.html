<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Vorzeichen-Maschine</title>
<style>
  :root{ --bg:#0b0e13; --fg:#e6edf3; --muted:#9aa4b2; --accent:#f2a63c; --line:#2a3038; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Roboto,sans-serif;}
  #wrap{padding:14px 18px;height:100%;overflow-y:auto;}
  h3{margin:0 0 8px;font-size:18px;color:var(--accent);}
  .modebar{display:flex;gap:8px;margin-bottom:14px;}
  .modebar button{background:#1f2630;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 16px;font-size:13.5px;cursor:pointer;}
  .modebar button.on{background:var(--accent);color:#12100a;font-weight:700;}
  .part{display:none;}
  .part.show{display:block;}
  .hint{font-size:12.5px;color:var(--muted);margin:4px 0 12px;}
  #termBox{font-size:26px;font-weight:700;text-align:center;background:#151b24;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:14px;}
  .guessrow{display:flex;gap:10px;justify-content:center;margin-bottom:14px;}
  .guessbtn{background:#1f2630;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:10px 26px;font-size:20px;font-weight:700;cursor:pointer;}
  .guessbtn.plus{color:#8adf9c;}
  .guessbtn.minus{color:#ff9d8a;}
  #feedback{background:#151b24;border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:15px;min-height:24px;text-align:center;}
  #feedback.ok{border-color:#4caf50;}
  #feedback.bad{border-color:#c0392b;}
  #streakBox{text-align:center;margin-top:10px;font-size:13.5px;color:var(--muted);}
  button.nextbtn{display:block;margin:14px auto 0;background:var(--accent);color:#12100a;font-weight:700;border:0;border-radius:8px;padding:9px 20px;font-size:14px;cursor:pointer;}
  #puzzleProblem{background:#151b24;border:1px solid var(--line);border-radius:8px;padding:16px 20px;font-size:18px;text-align:center;}
  .fdline{background:#151b24;border:1px solid var(--line);border-radius:8px;padding:10px 16px;margin:8px 0;cursor:pointer;font-size:16px;text-align:center;}
  .fdline:hover{background:#1f2630;}
  .fdline.correct-click{border-color:#4caf50;background:#173d28;cursor:default;}
  .fdline.wrong-click{border-color:#c0392b;background:#3d1c1c;}
  .fdfix{display:none;margin-top:8px;padding:10px 14px;background:#111722;border-left:4px solid #3dbb7a;border-radius:6px;font-size:14.5px;color:#dfe6ee;}
  .fdfix.show{display:block;}
</style>
</head>
<body>
<div id="wrap">
  <div class="modebar">
    <button id="modeMission" class="on">🎯 Missions-Modus</button>
    <button id="modePuzzle">🕵️ Rätselmodus</button>
  </div>

  <div class="part show" id="partMission">
    <h3>Vorzeichen-Maschine</h3>
    <p class="hint">Sag voraus, welches Vorzeichen beim Ausrechnen herauskommt, bevor du aufdeckst.</p>
    <div id="termBox">?</div>
    <div class="guessrow">
      <button class="guessbtn plus" id="guessPlus">+ Plus</button>
      <button class="guessbtn minus" id="guessMinus">− Minus</button>
    </div>
    <div id="feedback">Rate das Vorzeichen des Ergebnisses.</div>
    <div id="streakBox">Richtig: 0 / 0</div>
    <button class="nextbtn" id="nextBtn" style="display:none;">Nächster Term ▸</button>
  </div>

  <div class="part" id="partPuzzle">
    <h3>🕵️ Finde den Vorzeichenfehler</h3>
    <div id="puzzleProblem"></div>
    <div id="fdWrap" style="margin-top:14px;"></div>
  </div>
</div>
<script>
// === Missionsmodus: Vorzeichen vorhersagen ===
const TERMS=[
  {t:"(−6) · (−4)", sign:"+", val:24},
  {t:"(−9) · 5", sign:"−", val:-45},
  {t:"7 · (−8)", sign:"−", val:-56},
  {t:"(−3) · (−12)", sign:"+", val:36},
  {t:"(−20) : (−4)", sign:"+", val:5},
  {t:"18 : (−6)", sign:"−", val:-3},
  {t:"(−45) : 9", sign:"−", val:-5},
  {t:"(−7) · (−1) · (−2)", sign:"−", val:-14}
];
let idx=0, correct=0, answered=0, order=[...TERMS.keys()];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
shuffle(order);
function renderTerm(){
  document.getElementById('termBox').textContent = TERMS[order[idx % order.length]].t + " = ?";
  document.getElementById('feedback').className='';
  document.getElementById('feedback').textContent='Rate das Vorzeichen des Ergebnisses.';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('guessPlus').disabled=false;
  document.getElementById('guessMinus').disabled=false;
}
function guess(sign){
  const item=TERMS[order[idx % order.length]];
  document.getElementById('guessPlus').disabled=true;
  document.getElementById('guessMinus').disabled=true;
  answered++;
  const fb=document.getElementById('feedback');
  if(sign===item.sign){
    correct++;
    fb.className='ok';
    fb.textContent='✅ Richtig! '+item.t+' = '+item.val+' — Vorzeichen '+item.sign+'.';
  } else {
    fb.className='bad';
    fb.textContent='❌ Falsch. '+item.t+' = '+item.val+' — Vorzeichen ist '+item.sign+'.';
  }
  document.getElementById('streakBox').textContent='Richtig: '+correct+' / '+answered;
  if(answered===TERMS.length) window.lwAward && window.lwAward('mission');
  document.getElementById('nextBtn').style.display='block';
}
document.getElementById('guessPlus').onclick=()=>guess('+');
document.getElementById('guessMinus').onclick=()=>guess('−');
document.getElementById('nextBtn').onclick=()=>{ idx++; renderTerm(); };
renderTerm();

// === Raetselmodus: Fehler-Detektiv (Vorzeichenfehler) ===
const FD = {
  problem:"−3 · (4 − 7) = ?",
  lines:[
    {label:"Klammer zuerst", text:"4 − 7 = −3", wrong:false},
    {label:"Multiplizieren", text:"−3 · (−3) = −9", wrong:true, fix:"Minus mal Minus ergibt PLUS, nicht Minus! −3 · (−3) = +9, nicht −9."},
    {label:"Ergebnis", text:"−9", wrong:false}
  ],
  explain:"Beim Multiplizieren zweier negativer Zahlen wurde die Vorzeichenregel vergessen — gleiche Vorzeichen ergeben immer ein Plus."
};
(function(){
  const wrap=document.getElementById('fdWrap');
  const probEl=document.getElementById('puzzleProblem');
  probEl.textContent=FD.problem;
  let solved=false, wrongClicks=0;
  const hintBox=document.createElement('div');
  hintBox.style.cssText='margin-top:10px;padding:8px 12px;background:#3d2a12;border-left:4px solid var(--accent);border-radius:6px;font-size:14px;color:#f6e7cf;display:none;';
  FD.lines.forEach((ln)=>{
    const box=document.createElement('div'); box.className='fdline';
    box.textContent=ln.label+': '+ln.text;
    const fix=document.createElement('div'); fix.className='fdfix';
    if(ln.wrong) fix.textContent='✅ Richtig wäre: '+ln.fix;
    box.appendChild(fix);
    box.onclick=()=>{
      if(solved) return;
      if(ln.wrong){
        box.classList.add('correct-click');
        fix.classList.add('show');
        solved=true;
        hintBox.style.display='none';
        const msg=document.createElement('div');
        msg.style.cssText='margin-top:10px;font-size:15px;color:#3dbb7a;font-weight:600;text-align:center;';
        msg.textContent='🕵️ Gefunden! '+FD.explain;
        wrap.appendChild(msg);
      } else {
        box.classList.add('wrong-click');
        setTimeout(()=>box.classList.remove('wrong-click'),700);
        wrongClicks++;
        if(wrongClicks>=2){
          hintBox.textContent='💡 Tipp: schau dir den Schritt „'+FD.lines.find(l=>l.wrong).label+'" nochmal ganz genau an.';
          hintBox.style.display='block';
        }
      }
    };
    wrap.appendChild(box);
  });
  wrap.appendChild(hintBox);
})();

// mode switch
const modeMission=document.getElementById('modeMission'), modePuzzle=document.getElementById('modePuzzle');
const partMission=document.getElementById('partMission'), partPuzzle=document.getElementById('partPuzzle');
modeMission.onclick=()=>{ modeMission.classList.add('on'); modePuzzle.classList.remove('on'); partMission.classList.add('show'); partPuzzle.classList.remove('show'); };
modePuzzle.onclick=()=>{ modePuzzle.classList.add('on'); modeMission.classList.remove('on'); partPuzzle.classList.add('show'); partMission.classList.remove('show'); };
</script>
<script src="../gamify.js" defer></script>
</body>
</html>
