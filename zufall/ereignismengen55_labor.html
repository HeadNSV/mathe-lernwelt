<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ereignis-Mengen-Labor</title>
<style>
  :root{ --bg:#0b0e13; --fg:#e6edf3; --muted:#9aa4b2; --accent:#f2a63c; --line:#2a3038; }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Roboto,sans-serif;}
  #wrap{padding:16px 22px 40px;max-width:900px;margin:0 auto;}
  h2{margin:0 0 4px;font-size:22px;}
  .lead{color:var(--muted);font-size:15px;margin:0 0 14px;}
  .panel{background:#151b24;border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:14px;}
  .refbox{font-size:14px;color:var(--muted);margin-bottom:10px;}
  .refbox b{color:var(--fg);}
  .pts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0;}
  .pt{width:56px;height:56px;border-radius:50%;background:#1f2630;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;cursor:pointer;color:var(--fg);}
  .pt:hover{border-color:var(--accent);}
  .pt.on{background:var(--accent);color:#12100a;border-color:var(--accent);}
  .cbox{text-align:center;font-size:15px;margin:12px 0;color:var(--muted);}
  .cbox b{color:var(--fg);}
  .missionbar{display:flex;gap:8px;margin-bottom:10px;}
  .mchip{flex:1;text-align:center;padding:6px 8px;border-radius:8px;background:#1f2630;font-size:13px;color:var(--muted);}
  .mchip.active{background:var(--accent);color:#12100a;font-weight:700;}
  .mchip.done{background:#1c3d24;color:#dff3df;}
  .mission{background:#1a2733;border-left:5px solid #5fd0c7;border-radius:8px;padding:10px 16px;margin-top:10px;font-size:15px;text-align:center;}
  .mission.solved{background:#1c3d24;border-left-color:#4caf50;}
  .row{display:flex;gap:10px;justify-content:center;margin-top:12px;}
  button.act{background:#1f2630;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:15px;cursor:pointer;}
  button.act:hover{background:#283041;}
  button.act.primary{background:var(--accent);color:#12100a;font-weight:700;border-color:var(--accent);}
</style>
</head>
<body>
<div id="wrap">
  <h2>🧪 Ereignis-Mengen-Labor</h2>
  <p class="lead">Ω={1;2;3;4;5;6}. Klicke die Zahlen an, um dein Ereignis C zusammenzubauen — und prüfe, ob es der aktuellen Mission entspricht.</p>

  <div class="panel">
    <div class="refbox">Referenzmengen: <b>A</b> = „gerade Zahl" = {2;4;6} &nbsp;·&nbsp; <b>B</b> = „größer als 3" = {4;5;6}</div>
    <div class="missionbar">
      <div class="mchip" id="chip0">Mission 1: A∩B</div>
      <div class="mchip" id="chip1">Mission 2: A∪B</div>
      <div class="mchip" id="chip2">Mission 3: Ā</div>
    </div>
    <div class="pts" id="pts"></div>
    <div class="cbox">Dein Ereignis C = <b id="cSet">{}</b></div>
    <div class="mission" id="missionBox"></div>
    <div class="row">
      <button class="act" id="btnReset">C leeren</button>
      <button class="act primary" id="btnCheck">Prüfen</button>
      <button class="act" id="btnNext">Nächste Mission ▸</button>
    </div>
  </div>
</div>

<script>
const A=[2,4,6], B=[4,5,6];
const AB=(x)=>new Set(x);
const targets=[
  {label:"A∩B", set:AB([4,6]), desc:"Baue A∩B (gerade UND größer als 3)."},
  {label:"A∪B", set:AB([2,4,5,6]), desc:"Baue A∪B (gerade ODER größer als 3)."},
  {label:"Ā", set:AB([1,3,5]), desc:"Baue Ā, das Gegenereignis von A (NICHT gerade)."}
];
let selected=new Set();
let mission=0;
let solved=[false,false,false];

function renderPts(){
  const host=document.getElementById('pts');
  host.innerHTML='';
  for(let i=1;i<=6;i++){
    const d=document.createElement('div');
    d.className='pt'+(selected.has(i)?' on':'');
    d.textContent=i;
    d.onclick=()=>{ if(selected.has(i)) selected.delete(i); else selected.add(i); renderPts(); renderC(); };
    host.appendChild(d);
  }
}
function setsEqual(a,b){
  if(a.size!==b.size) return false;
  for(const x of a) if(!b.has(x)) return false;
  return true;
}
function renderC(){
  const arr=[...selected].sort((a,b)=>a-b);
  document.getElementById('cSet').textContent='{'+arr.join(';')+'}';
}
function renderMissionBar(){
  for(let i=0;i<3;i++){
    const chip=document.getElementById('chip'+i);
    chip.classList.toggle('active', i===mission);
    chip.classList.toggle('done', solved[i]);
  }
}
function renderMissionBox(){
  const box=document.getElementById('missionBox');
  const t=targets[mission];
  if(solved[mission]){
    box.classList.add('solved');
    box.textContent='✅ '+t.label+' bereits korrekt gebaut (C seither evtl. verändert).';
  } else {
    box.classList.remove('solved');
    box.textContent='🎯 Mission '+(mission+1)+': '+t.desc;
  }
}
document.getElementById('btnReset').onclick=()=>{ selected=new Set(); renderPts(); renderC(); };
document.getElementById('btnCheck').onclick=()=>{
  const t=targets[mission];
  if(setsEqual(selected, t.set)){
    solved[mission]=true;
  }
  renderMissionBar();
  renderMissionBox();
};
document.getElementById('btnNext').onclick=()=>{
  mission=(mission+1)%3;
  renderMissionBar();
  renderMissionBox();
};
renderPts();
renderC();
renderMissionBar();
renderMissionBox();

window.LAB={
  state(){
    return {
      selected: [...selected].sort((a,b)=>a-b),
      mission: mission,
      solved: solved.slice()
    };
  },
  toggle(n){ if(selected.has(n)) selected.delete(n); else selected.add(n); renderPts(); renderC(); },
  reset(){ document.getElementById('btnReset').onclick(); },
  check(){ document.getElementById('btnCheck').onclick(); },
  setMission(i){ mission=i; renderMissionBar(); renderMissionBox(); },
  nextMission(){ document.getElementById('btnNext').onclick(); }
};
</script>
</body>
</html>
