<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Quadrat-Vervollständiger — Labor</title>
<style>
  :root{ --bg:#0b0e13; --fg:#e6edf3; --muted:#9aa4b2; --accent:#f2a63c; --line:#2a3038; }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Roboto,sans-serif;}
  #wrap{max-width:700px;margin:0 auto;padding:18px 20px 40px;}
  h3{margin:0 0 6px;}
  .hint{font-size:13px;color:var(--muted);margin-bottom:12px;}
  .controls{background:#151b24;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px;}
  .row{display:flex;align-items:center;gap:12px;margin:10px 0;}
  .row label{font-size:14px;color:var(--muted);min-width:90px;}
  input[type=range]{flex:1;}
  .valbox{background:#1f2630;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:14px;font-weight:700;color:var(--accent);min-width:44px;text-align:center;}
  #eqLabel{font-size:20px;color:var(--accent);text-align:center;font-weight:700;margin:12px 0;}
  #svgHost{background:#0e131b;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;}
  #completeBtn{display:block;margin:14px auto;background:var(--accent);color:#12100a;font-weight:700;border:0;border-radius:8px;padding:10px 20px;font-size:15px;cursor:pointer;}
  #completeBtn:disabled{opacity:0.4;cursor:default;}
  #resultBox{text-align:center;font-size:15px;min-height:22px;margin-top:8px;color:#5fd0c7;font-weight:700;}
</style>
</head>
<body>
<div id="wrap">
  <h3>🎯 Quadrat vervollständigen</h3>
  <p class="hint">Wähle b — dann klick auf „Quadrat vervollständigen", um das fehlende Eckstück zu ergänzen.</p>
  <div class="controls">
    <div class="row"><label for="bSlider">b</label><input type="range" id="bSlider" min="2" max="10" step="2" value="4"/><span class="valbox" id="bVal">4</span></div>
  </div>
  <div id="eqLabel"></div>
  <div id="svgHost"></div>
  <button id="completeBtn">Quadrat vervollständigen</button>
  <div id="resultBox"></div>
</div>
<script>
let b=4, completed=false;
const unit=10; // px pro Einheit von b/2

function buildSVG(b, done){
  const half=b/2, stripW=half*unit, side=100;
  const x0=25, y0=15;
  const totalW = side + stripW + 25;
  const totalH = side + stripW + 40;
  let s='<svg viewBox="0 0 '+(totalW)+' '+(totalH)+'" style="width:100%;max-width:340px;height:auto;display:block;margin:0 auto;">';
  // x^2 Quadrat
  s+='<rect x="'+x0+'" y="'+y0+'" width="'+side+'" height="'+side+'" fill="rgba(242,166,60,0.22)" stroke="#f2a63c" stroke-width="1.5"/>';
  s+='<text x="'+(x0+side/2)+'" y="'+(y0+side/2+5)+'" text-anchor="middle" font-size="16" font-weight="700" fill="#f2a63c">x²</text>';
  // rechter Streifen (b/2 * x)
  s+='<rect x="'+(x0+side)+'" y="'+y0+'" width="'+stripW+'" height="'+side+'" fill="rgba(95,208,199,0.22)" stroke="#5fd0c7" stroke-width="1.5"/>';
  s+='<text x="'+(x0+side+stripW/2)+'" y="'+(y0+side/2+5)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#5fd0c7">'+half+'x</text>';
  // unterer Streifen (b/2 * x)
  s+='<rect x="'+x0+'" y="'+(y0+side)+'" width="'+side+'" height="'+stripW+'" fill="rgba(95,208,199,0.22)" stroke="#5fd0c7" stroke-width="1.5"/>';
  s+='<text x="'+(x0+side/2)+'" y="'+(y0+side+stripW/2+4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#5fd0c7">'+half+'x</text>';
  // Eckstueck (b/2)^2
  if(done){
    s+='<rect x="'+(x0+side)+'" y="'+(y0+side)+'" width="'+stripW+'" height="'+stripW+'" fill="rgba(76,175,80,0.35)" stroke="#4caf50" stroke-width="1.5"/>';
    s+='<text x="'+(x0+side+stripW/2)+'" y="'+(y0+side+stripW/2+4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#4caf50">'+half+'²</text>';
  } else {
    s+='<rect x="'+(x0+side)+'" y="'+(y0+side)+'" width="'+stripW+'" height="'+stripW+'" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>';
    s+='<text x="'+(x0+side+stripW/2)+'" y="'+(y0+side+stripW/2+4)+'" text-anchor="middle" font-size="9" fill="#c0392b">?</text>';
  }
  s+='<text x="'+(totalW/2)+'" y="'+(totalH-8)+'" text-anchor="middle" font-size="11" fill="#9aa4b2">Seite x</text>';
  s+='</svg>';
  return s;
}
function render(){
  document.getElementById('bVal').textContent=b;
  document.getElementById('eqLabel').textContent = completed
    ? 'x² + '+b+'x + '+(b/2)*(b/2)+' = (x+'+(b/2)+')²'
    : 'x² + '+b+'x';
  document.getElementById('svgHost').innerHTML = buildSVG(b, completed);
  document.getElementById('completeBtn').disabled = completed;
  document.getElementById('resultBox').textContent = completed
    ? '✅ Vervollständigt! Das fehlende Eckstück war ('+(b/2)+')² = '+((b/2)*(b/2))+'.'
    : '';
}
document.getElementById('bSlider').addEventListener('input', e=>{
  b=parseInt(e.target.value);
  completed=false;
  render();
});
document.getElementById('completeBtn').addEventListener('click', ()=>{
  completed=true;
  render();
  window.lwAward && window.lwAward('mission', 'b'+b);
});
render();

// Test-Hook fuer Playwright-Verifikation
window.LAB = {
  state: () => ({b, completed, corner: (b/2)*(b/2)}),
  setB: (nb) => { b=nb; completed=false; render(); },
  complete: () => { document.getElementById('completeBtn').click(); }
};
</script>
<script src="../gamify.js" defer></script>
</body>
</html>
